
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Muskan! 🎂</title>
    <link rel="stylesheet" href="style.css">
    <script src="script1.js" defer></script>
</head>
<body>
    <div class="floating-hearts">💗 ✨ 💕 🎀 💖</div>

    <main class="container">
        <section class="birthday-card">
            <p class="small-title">A SPECIAL MESSAGE FOR YOU 💌</p>

            <h1>Happy Birthday, <span>Muskan!</span> 🎂</h1>

            <p class="intro">
                Oya birthday birsine maanxe 😂
                I made something for you!
            </p>

            <div class="cake">🎂</div>

            <h2>Do you still remember me? 👀</h2>
            <p class="question">Choose your answer carefully 😂</p>

            <div class="button-area" id="buttonArea">
                <button id="yesButton" class="yes-button">
                    Of course! 💗
                </button>

                <button id="noButton" class="no-button">
                    Ko ho ra tme? 🤨
                </button>
            </div>

            <p id="hint" class="hint">Try clicking NO 😂</p>
        </section>

        <footer>Made with 💗 just for you.</footer>
    </main>
</body>
</html>
